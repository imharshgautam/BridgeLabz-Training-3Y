<!DOCTYPE html>
<!--
    The <!DOCTYPE html> declaration tells the browser this document
    uses HTML5. It ensures the page is parsed in standards mode so
    modern HTML, CSS and JavaScript features behave consistently.
-->
<html lang="en">
<!--
    The lang attribute declares the primary language of the page
    (here English). This helps search engines, translation tools,
    and assistive technologies (screen readers) choose correct
    pronunciation and language-specific processing.
-->
<head>
    <!--
        The head element contains metadata and resources used by the
        browser but not directly displayed in the page content.
        Typical children include <meta>, <title>, <link>, and <script>.
    -->
    <meta charset="UTF-8">
    <!--
        The charset meta declares the character encoding for the
        document. UTF-8 is the recommended encoding: it supports
        virtually all characters and ensures text displays correctly.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        The viewport meta makes the layout responsive on mobile devices.
        width=device-width sets the viewport width to the device width.
        initial-scale=1.0 sets the initial zoom level. Without this,
        pages may look zoomed-out or not scale properly on phones.
    -->
    <title>Document</title>
    <!--
        The title element sets the text shown in the browser tab and
        is also used by search engines as the page title in results.
        Use a concise, descriptive title for better usability and SEO.
    -->
</head>
<!--
    The head is closed above. Content visible to users goes inside
    the <body> element below.
-->
<body>
    <!--
        The body contains the document's visible content (text, images,
        forms, interactive elements, etc.). Keep content semantic using
        appropriate elements like <header>, <main>, <article>,
        <section>, <footer>, and headings (<h1>-<h6>).

        Accessibility tips:
            - Use semantic elements for structure.
            - Provide alt attributes for images.
            - Ensure sufficient color contrast.
            - Use ARIA only when necessary and correctly.
    -->

</body>
</html>
<!--
    Closing html tag. The document ends here.
-->
