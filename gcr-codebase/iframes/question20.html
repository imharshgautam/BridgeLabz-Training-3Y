<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the title displayed in the browser tab -->
    <title>Complete Head Example</title>
    <!-- Defines the character encoding -->
    <meta charset="UTF-8">
    <!-- Provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">
    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Harsh Kumar Gautam">
    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">
    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">
    <!-- Style element can contain CSS; kept empty as required -->
    <style>
    </style>
    <!-- Script element can contain JavaScript; kept empty as required -->
    <script>
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page demonstrates important elements used inside the head section.</p>
</body>
</html>
