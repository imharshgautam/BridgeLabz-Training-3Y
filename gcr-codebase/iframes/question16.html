<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>URI Encoding</title></head>
<body>
    <h1>URI Encoding Example</h1>
    <!-- Spaces are encoded using %20 and ampersand as %26 inside the query value -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML & CSS</a>
    <p>Encoded URL: https://example.com/search?query=HTML%20%26%20CSS</p>
</body>
</html>
